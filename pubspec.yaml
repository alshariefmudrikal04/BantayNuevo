name: bantay_nuevo
description: >
  Violence Response Application with GPS Tracking and Secure Evidence Storage
  for Barangay Camino Nuevo. Three roles: resident, tanod, police.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase — see lib/firebase_options.dart for where to paste real config
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4  # kept for when we switch back from Cloudinary — see cloudinary_config.dart
  http: ^1.2.2  # TEMPORARY — Cloudinary evidence upload (demo purposes, no Blaze card needed)
  firebase_messaging: ^15.1.3

  # State management
  flutter_riverpod: ^2.6.1

  # Location (Prompt 3 — report form GPS, Prompt 4 — SOS)
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  # Live SOS map — free, no API key/card needed. Using this instead of
  # google_maps_flutter for the live tracking map specifically, since Maps
  # needs a billing-enabled Google Cloud API key. Swap to google_maps_flutter
  # later if desired — same lat/lng data either way.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Evidence upload (Prompt 3 — report form)
  image_picker: ^1.1.2
  file_picker: ^10.3.3

  # Security screen (Prompt 7)
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5  # PIN hashing — see core/utils/pin_hash.dart

  # NOTE: telephony package was removed — it caused build errors. Offline SMS
  # now uses url_launcher's sms: scheme instead (opens native SMS app
  # pre-filled, user taps send — less silent, but far more reliable).

  # Connectivity check (Prompt 4 — online/offline branching)


  # Dial hotline numbers (Prompt 8 — resources screen)
  url_launcher: ^6.3.0

  # Fonts — Space Grotesk / IBM Plex Sans / IBM Plex Mono (AGENTS.md §4)
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
